# DIAG (dodge): one-boot panel module test, like 91-dodge-oneshot.conf.
# /root/panel.oneshot.ko is moved to /run and bind-mounted over the panel
# module for this boot only.
[Service]
ExecStartPre=-/bin/sh -c 'f=/root/panel.oneshot.ko; t=/usr/local/lib/omamobile/display/panel-aa569-p-3-a0019-dsc.ko; if [ -f $$f ]; then mv $$f /run/panel.oneshot.ko && sync && mount --bind /run/panel.oneshot.ko $$t && echo "dodge-oneshot: $$(sha256sum /run/panel.oneshot.ko)" > /dev/kmsg; fi; true'
