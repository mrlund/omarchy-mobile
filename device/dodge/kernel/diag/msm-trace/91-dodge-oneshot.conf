# DIAG (dodge): one-boot msm.ko test. If /root/msm.oneshot.ko exists it is
# moved to /run (so the next boot never sees it) and bind-mounted over
# display/msm.ko for this boot only. A test module that hangs the phone
# is therefore gone after the watchdog/panic reboot.
[Service]
ExecStartPre=-/bin/sh -c 'f=/root/msm.oneshot.ko; t=/usr/local/lib/omamobile/display/msm.ko; if [ -f $$f ]; then mv $$f /run/msm.oneshot.ko && sync && mount --bind /run/msm.oneshot.ko $$t && echo "dodge-oneshot: $$(sha256sum /run/msm.oneshot.ko)" > /dev/kmsg; fi; true'
