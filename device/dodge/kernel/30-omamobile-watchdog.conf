# /etc/systemd/system.conf.d/. The 7.3 kernel has the Gunyah watchdog
# (max 32 s). The initramfs feeds it until switch_root, which kills the
# feeder, so systemd has to open it straight away. 6.16 has no
# /dev/watchdog, so this changes nothing there.
[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=30s
