# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 13 (dodge). Format rules: device/cheetah/device.conf.
#
# Omarchy boot lives on the inactive-at-stock slot (boot_b as of 2026-10-28).
# Stock boot_a is the fallback image. tools/install-phone flashes OMAMOBILE_SLOT
# (else the inactive slot), requires --firmware-slots-match for qcom-abl, and
# never flashes xbl, abl, vbmeta or modem. See BRINGUP-M1.md (phone evidence).

CODENAME=dodge
NAME="OnePlus 13"
SOC=sm8750
COMPATIBLE="oneplus,dodge"
PACKAGE=omamobile-device-dodge
BOOT_METHOD=qcom-abl

DTB=qcom/sm8750-oneplus-dodge.dtb
INITRAMFS_INIT=initramfs/init
PANEL_SIZE=1440x3168

BOOT_IMAGES=boot
# Both slots allowlisted so first install (stock on A → flash B) and later
# reflashes of OMAMOBILE_SLOT work. userdata holds the Arch root.
UFS_RW="boot_a boot_b userdata"
# Omarchy home slot after the 2026-10-28 firmware-match move.
OMAMOBILE_SLOT=b
