# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 13 (dodge). Format rules: device/cheetah/device.conf.
#
# OMAMOBILE_SLOT=inactive: first-install onto the slot that is not running
# (stock stays on the running slot; tools/firmware-match copies firmware
# running→target). Day-2 updates are packages. To rewrite boot/userdata on an
# already-Omarchy phone without touching the other slot: install-phone --reflash
# (targets current-slot; skips the firmware helper). FASTBOOT_PRODUCT=sun is
# ABL getvar product. Never flashes xbl, abl, vbmeta or modem.
# See BRINGUP-M1.md and device/dodge/firmware-match/README.md.

CODENAME=dodge
FASTBOOT_PRODUCT=sun
NAME="OnePlus 13"
SOC=sm8750
COMPATIBLE="oneplus,dodge"
PACKAGE=omamobile-device-dodge
BOOT_METHOD=qcom-abl

DTB=qcom/sm8750-oneplus-dodge.dtb
INITRAMFS_INIT=initramfs/init
PANEL_SIZE=1440x3168

BOOT_IMAGES=boot
# Both slots allowlisted so first install (stock running → flash inactive) and
# --reflash (rewrite the Omarchy slot in place) work. userdata holds the Arch root.
UFS_RW="boot_a boot_b userdata"
OMAMOBILE_SLOT=inactive
