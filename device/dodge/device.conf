# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 13 (dodge). Format rules: device/cheetah/device.conf.
#
# Install target is the *inactive* slot (tools/install-phone reads current-slot
# and flashes the other). Both boot slots are on the storage-guard allowlist so
# the inactive one can be written; the installer never flashes xbl, abl, vbmeta
# or modem. Firmware on the inactive slot must match the running slot: pass
# --firmware-slots-match (required for BOOT_METHOD=qcom-abl).

CODENAME=dodge
NAME="OnePlus 13"
SOC=sm8750
COMPATIBLE="oneplus,dodge"
PACKAGE=omamobile-device-dodge
BOOT_METHOD=qcom-abl

DTB=qcom/sm8750-oneplus-dodge.dtb
INITRAMFS_INIT=initramfs/init
PANEL_SIZE=1440x3168

BOOT_IMAGES=boot
# Both slots allowed: installer picks the inactive one at run time.
UFS_RW="boot_a boot_b userdata"
