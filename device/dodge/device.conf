# SPDX-License-Identifier: MIT
# Device descriptor: OnePlus 13 (dodge). Format rules: device/cheetah/device.conf.
# Omarchy boot lives on the inactive-at-stock slot (boot_b as of 2026-10-28).
# Stock boot_a is the fallback image; firmware-match gate before any set_active
# (PLAN §3.3). Never name vbmeta / modem / xbl here as flash targets.

CODENAME=dodge
NAME="OnePlus 13"
SOC=sm8750
COMPATIBLE="oneplus,dodge"
PACKAGE=omamobile-device-dodge

DTB=qcom/sm8750-oneplus-dodge.dtb
INITRAMFS_INIT=initramfs/init
PANEL_SIZE=1440x3168

BOOT_IMAGES=boot
UFS_RW=userdata
# Omarchy slot after the 2026-10-28 slot-B move. Installer / restore tools
# should treat this as the write target; stock stays on the other slot.
OMAMOBILE_SLOT=b
