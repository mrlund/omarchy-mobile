## dodge: default route volume for the built-in card.
## WirePlumber's global default is 0.064 linear (0.40 on the cubic scale wpctl
## shows), which with the amplifiers at their -30 dB cap is too quiet.
## 0.343 linear = 0.70 cubic (about -9.3 dB). Paired with UCM Speaker
## stream0.vol_ctrl0 at 65535 (Q13 ≈ +18 dB; 8192 = 0 dB) and amp volume at
## the driver cap (703 / min_atten 320), this is the chosen speaker loudness.
## Net digital path is about +8.8 dB gain; content above about -8.8 dBFS
## clips in the DSP, but the amplifier driver still enforces the hardware cap.
## Applies only while no route volume is saved; a user change is remembered.
## Pair with UCM PlaybackChannels 2 (FL top / FR bottom; Left chsel1,
## Right chsel2). Stereo PCM reaches both amps; the MI2S mixer put uses
## value[0] only (1,1 in UCM matches the control's channel count). UCM sets
## stream0.vol_ctrl0 to 65535 only on the Speaker path (8192 on Headphones
## and Earpiece).
## Install to /etc/wireplumber/wireplumber.conf.d/.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        device.routes.default-sink-volume = 0.343
        # Without this the sources would fall back to the sink value above.
        device.routes.default-source-volume = 1.0
      }
    }
  }
]
