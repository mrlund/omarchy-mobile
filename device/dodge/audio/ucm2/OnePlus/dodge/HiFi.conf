# SPDX-License-Identifier: BSD-3-Clause
# Speaker only. Amplifier gain stays at the driver default; the driver
# caps it (attenuation floor) until speaker protection and calibration exist.

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
