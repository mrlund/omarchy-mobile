# Speaker playback and the two built-in microphones. Amplifier gain stays at the driver default; the driver
# caps it (attenuation floor) until speaker protection and calibration exist.

SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# Built-in microphones: AMIC1 (WCD939x ADC1, SoundWire TX channel 0) and
# AMIC5 (ADC4, channel 3), both on MIC BIAS1, into TX decimators 0 and 1.
SectionDevice."Mic" {
	Comment "Internal microphones"

	EnableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='TX0 MODE' ADC_ULP"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC4 MUX' CH4_AMIC5"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC4 Volume' 10"
		cset "name='TX3 MODE' ADC_ULP"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC3"
		cset "name='TX_DEC1 Volume' 100"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
